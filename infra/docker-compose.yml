# Notcery local development stack (Faz 0)

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: notcery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notcery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notcery}
      POSTGRES_DB: ${POSTGRES_DB:-notcery}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - notcery_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-notcery} -d ${POSTGRES_DB:-notcery}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: notcery-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - notcery_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: notcery-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - notcery_minio_data:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: capture outbound SMTP and browse emails at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: notcery-mailpit
    restart: unless-stopped
    profiles: ["mail"]
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  # Uncomment when the Django backend is scaffolded (see docs/fazlar/faz-0-altyapi.md)
