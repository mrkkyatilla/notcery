  #     redis:
  #       condition: service_healthy
  #     minio:
  #       condition: service_healthy
  #   env_file:
  #     - ../.env
  #   ports:
  #     - "${BACKEND_PORT:-8000}:8000"
  #   command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000"]

