# Installed to /etc/nginx/sites-available/notcery
# Certbot will add SSL server blocks; this is the HTTP + app routing template.

upstream notcery_backend {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name note.wrupup.com;

    root /var/www/notcery/frontend/dist;
    index index.html;

    client_max_body_size 32m;

    # Cloudflare / reverse proxy
    set $forwarded_proto $http_x_forwarded_proto;
    if ($forwarded_proto = "") {
        set $forwarded_proto $scheme;
    }

    location /api/ {
        proxy_pass http://notcery_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
    }

    location /admin/ {
        proxy_pass http://notcery_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /static/ {
        alias /var/www/notcery/backend/staticfiles/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
