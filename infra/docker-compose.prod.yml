# Production overlay: bind infra ports to localhost only.
# Usage (from repo root):
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
